name: PR title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions: {}
jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ]'; then
            echo "PR title is not a Conventional Commit: $TITLE"
            echo "Expected: type(scope): description"
            exit 1
          fi
          if [ "${#TITLE}" -gt 72 ]; then echo "PR title is longer than 72 characters"; exit 1; fi
          case "$TITLE" in *.) echo "PR title ends with a period"; exit 1 ;; esac
